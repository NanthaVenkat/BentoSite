            </footer>
        </div>
    </div>

    <script>
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), // easeOutExpo
            smooth: true,
            direction: 'vertical',
            gestureDirection: 'vertical',
            smoothTouch: false, // if true, slows mobile scroll too
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);
    </script>

</body>

</html>
